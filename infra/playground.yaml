AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Strands Box playground behind CloudFront. The page is a static file in a private S3 bucket (origin
  access control); /api/* goes to a Lambda Function URL that runs the playground API over microvm-ctl.
  The Function URL answers only requests carrying the secret header CloudFront adds, and every API call
  needs the playground key.

Parameters:
  PlaygroundKey:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: The key the page asks for before it calls the API.
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Random value CloudFront sends to the Function URL in x-origin-verify.
  CodeBucket:
    Type: String
    Description: Bucket holding the Lambda zip (the microvm-ctl artifact bucket works).
  CodeKey:
    Type: String
  ImageName:
    Type: String
    Default: strands-box
  VmExecutionRoleArn:
    Type: String
    Description: The execution role the strands-box microVMs run with (passed to RunMicrovm).
  MaxVms:
    Type: Number
    Default: 3
    Description: strands-box microVMs active at once through the playground.
  LaunchesPerHour:
    Type: Number
    Default: 12
    Description: launches in any rolling hour, counted from ListMicrovms.
  MaxDurationSeconds:
    Type: Number
    Default: 900
  RequestsPer5MinPerIp:
    Type: Number
    Default: 300
    Description: WAF rate limit on every request from one IP.
  ApiWritesPer5MinPerIp:
    Type: Number
    Default: 60
    Description: WAF rate limit on POST /api/* from one IP.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  StatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification: { SSEEnabled: true }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: drive-strands-box-microvms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Lifecycle
                Effect: Allow
                Action:
                  - lambda:RunMicrovm
                  - lambda:GetMicrovm
                  - lambda:ListMicrovms
                  - lambda:SuspendMicrovm
                  - lambda:ResumeMicrovm
                  - lambda:TerminateMicrovm
                  - lambda:CreateMicrovmAuthToken
                  - lambda:GetMicrovmImage
                  - lambda:ListMicrovmImages
                  - lambda:ListMicrovmImageVersions
                  - lambda:GetMicrovmImageVersion
                Resource: "*"
              - Sid: PassConnectors
                Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource: "arn:aws:lambda:*:aws:network-connector:aws-network-connector:*"
              - Sid: PassVmRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Ref VmExecutionRoleArn
              - Sid: Quotas
                Effect: Allow
                Action: servicequotas:GetServiceQuota
                Resource: "*"
              - Sid: UsageCounters
                Effect: Allow
                Action: [dynamodb:UpdateItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt StatsTable.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: server.lambda_handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt ApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Environment:
        Variables:
          MVM_REGION: !Ref AWS::Region
          MVM_EXECUTION_ROLE_ARN: !Ref VmExecutionRoleArn
          SBX_IMAGE: !Ref ImageName
          SBX_MAX_VMS: !Ref MaxVms
          SBX_MAX_TASKS: "48"
          SBX_LAUNCHES_PER_HOUR: !Ref LaunchesPerHour
          SBX_MAX_DURATION_S: !Ref MaxDurationSeconds
          SBX_IDLE_S: "180"
          SBX_STATIC: /var/task/static
          SBX_BOX_FILES: /var/task/box
          SBX_RESULTS: /var/task/results
          PLAYGROUND_KEY: !Ref PlaygroundKey
          ORIGIN_SECRET: !Ref OriginSecret
          SBX_STATS_TABLE: !Ref StatsTable

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE

  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Function URLs created after October 2025 also need InvokeFunction, scoped to calls through the URL.
  ApiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-acl"
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "${AWS::StackName}-acl" }
      Rules:
        - Name: api-writes-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref ApiWritesPer5MinPerIp
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - ByteMatchStatement:
                        FieldToMatch: { Method: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: api-writes-per-ip }
        - Name: all-requests-per-ip
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement: { Limit: !Ref RequestsPer5MinPerIp, AggregateKeyType: IP }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: all-requests-per-ip }
        - Name: aws-ip-reputation
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-ip-reputation }
        - Name: aws-common
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY   # a task with files can pass 8 KB; the API caps sizes itself
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-common }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        WebACLId: !GetAtt WebAcl.Arn
        Comment: Strands Box playground
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOac
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Ref OriginSecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  Url:
    Value: !Sub "https://${Distribution.DomainName}"
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
